name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v7

      - name: 📦 Install Mise
        uses: jdx/mise-action@v5

      - name: 📋 Lint
        run: mise run lint
