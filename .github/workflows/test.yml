name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v7

      - name: 📦 Install Mise
        uses: jdx/mise-action@v5

      - name: 🧪 Test
        run: mise run test
